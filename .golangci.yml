version: 2

run:
  timeout: 5m
  tests: true

linters:
  # Use the default enabled linters
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: true
  errcheck:
    check-type-assertions: true

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 50
  max-same-issues: 3
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  exclude-use-default: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
